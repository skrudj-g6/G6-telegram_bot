name: CI

on:
  push:
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: test
          POSTGRES_PASSWORD: test
          POSTGRES_DB: altyn_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U test -d altyn_test"
          --health-interval 5s --health-timeout 3s --health-retries 10
    env:
      TEST_POSTGRES_URL: postgresql+psycopg://test:test@localhost:5432/altyn_test
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12", cache: pip, cache-dependency-path: backend/requirements.txt }
      - run: pip install -r requirements.txt
      - run: python -m pytest -q

  bot:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: bot
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12", cache: pip, cache-dependency-path: bot/requirements.txt }
      - run: pip install -r requirements.txt
      - run: python -m pytest -q

  admin:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: admin
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: npm install --no-audit --no-fund
      - run: npm test
      - run: npm run build

  secrets:
    # Токены и ключи не должны попадать в репозиторий (этап 0).
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          if git grep -nE '[0-9]{8,10}:[A-Za-z0-9_-]{35}' -- . ':!*.md'; then
            echo "Найден токен Telegram"; exit 1
          fi
