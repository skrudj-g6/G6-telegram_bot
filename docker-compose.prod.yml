# Production-надстройка: HTTPS через Caddy, внутренние порты наружу не публикуются.
#   docker compose -f docker-compose.yml -f docker-compose.prod.yml up -d --build
# В .env должны быть APP_ENV=production и DOMAIN=panel.example.com
services:
  backend:
    ports: !reset []
  admin:
    ports: !reset []
  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    depends_on:
      - admin
    environment:
      DOMAIN: ${DOMAIN:?задайте DOMAIN в .env (например panel.example.com)}
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config

volumes:
  caddy_data:
  caddy_config:
