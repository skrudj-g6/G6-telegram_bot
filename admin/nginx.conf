server {
    listen 80;
    # За Caddy (production) настоящий адрес сотрудника приходит в X-Forwarded-For; доверяем ему
    # только от контейнеров docker-сети. Из этого адреса nginx передаёт backend X-Real-IP (Q-52).
    set_real_ip_from 172.16.0.0/12;
    set_real_ip_from 10.0.0.0/8;
    set_real_ip_from 192.168.0.0/16;
    real_ip_header X-Forwarded-For;

    root /usr/share/nginx/html;
    index index.html;

    # API панели проксируется на backend: один origin, поэтому refresh-cookie (SameSite=Strict) работает.
    location /admin/v1/ {
        proxy_pass http://backend:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        client_max_body_size 1m;
    }
    # Внутренний API бота снаружи недоступен.
    location /bot/ { return 404; }

    location / {
        try_files $uri /index.html;
        add_header X-Frame-Options DENY;
        add_header X-Content-Type-Options nosniff;
        add_header Referrer-Policy no-referrer;
    }
}
